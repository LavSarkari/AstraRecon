schema_version: 1
id: assetfinder
name: Assetfinder
plugin_version: "1.0.0"
stage: subdomains
description: "Find domains and subdomains related to a given domain"
author: "TomNomNom"

binary:
  name: assetfinder
  check_args: ["-h"]
  version_regex: 'assetfinder'

inputs:
  - name: target
    type: TargetDomain
    required: true
    source: param

outputs:
  - name: subdomains
    type: FQDN
    format: text_lines
    filename: subdomains.txt

execution:
  command: assetfinder
  args:
    - "--subs-only"
    - "{inputs.target}"
  timeout_seconds: 300
  retry_count: 1

cache:
  policy: fresh
  default_ttl_hours: 24
