[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrarecon"
version = "0.1.0"
description = "Linux-first, DAG-based recon orchestration engine with persistent sessions and Content-Addressed Storage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "LavSarkari" }
]
keywords = [
    "recon",
    "reconnaissance",
    "security",
    "bugbounty",
    "osint",
    "dag",
    "orchestration",
    "subfinder",
    "nuclei",
    "httpx",
    "amass",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
astrarecon = "astrarecon.cli.main:cli_entrypoint"

[project.urls]
Homepage = "https://github.com/LavSarkari/AstraRecon"
Documentation = "https://github.com/LavSarkari/AstraRecon#readme"
Repository = "https://github.com/LavSarkari/AstraRecon"
Issues = "https://github.com/LavSarkari/AstraRecon/issues"

[tool.hatch.build.targets.wheel]
packages = ["astrarecon"]

[tool.hatch.build.targets.sdist]
include = [
    "/astrarecon",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/logo.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
